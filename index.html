<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCAT6 — Évaluation de commotion cérébrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0B1E33;
  --navy-800:#102A45;
  --navy-700:#173A5E;
  --blue-600:#1F5C8B;
  --blue-500:#2C74A8;
  --ice-100:#EAF1F6;
  --ice-50:#F5F8FA;
  --paper:#FCFDFE;
  --line:#D7E1E9;
  --ink:#0F2233;
  --ink-soft:#4C5D6B;
  --amber:#B7791F;
  --amber-bg:#FBF3E1;
  --red:#B3261E;
  --red-bg:#FDECEA;
  --red-line:#F3C6C2;
  --green:#1E6E4C;
  --green-bg:#E9F5EE;
  --radius:10px;
  --shadow:0 1px 2px rgba(11,30,51,.06), 0 6px 20px -8px rgba(11,30,51,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--ice-50);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:270px;flex:none;background:var(--navy-900);color:#fff;
  display:flex;flex-direction:column;padding:26px 18px 18px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:18px;}
.brand .mark{
  font-family:'Source Serif 4',serif;font-weight:700;font-size:26px;letter-spacing:.5px;color:#fff;
}
.brand .mark span{color:#7FB8E0;}
.brand .sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8FA6BC;margin-top:4px;}
.steps{list-style:none;margin:0;padding:0;flex:1;}
.steps li{margin-bottom:2px;}
.step-btn{
  width:100%;text-align:left;background:none;border:none;color:#C7D6E2;
  font-family:inherit;font-size:13.5px;font-weight:500;padding:10px 12px;border-radius:8px;
  display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s,color .15s;
}
.step-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
.step-btn.active{background:var(--blue-600);color:#fff;}
.step-num{
  width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none;
  font-family:'IBM Plex Mono',monospace;
}
.step-btn.active .step-num{background:rgba(255,255,255,.25);}
.step-btn.done .step-num{background:#3E8A5F;}
.step-btn.flagged .step-num{background:var(--red);}
.sidebar-foot{padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#7C93A9;line-height:1.5;}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--paper);border-bottom:1px solid var(--line);padding:16px 34px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:5;
}
.topbar h1{font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;margin:0;color:var(--navy-900);}
.topbar .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.topbar-actions{display:flex;gap:8px;}
.btn{
  font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--navy-800);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--blue-500);color:var(--blue-600);}
.btn-primary{background:var(--blue-600);color:#fff;border-color:var(--blue-600);}
.btn-primary:hover{background:var(--navy-700);border-color:var(--navy-700);color:#fff;}

.content{padding:30px 34px 80px;max-width:880px;}
.panel{display:none;}
.panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.panel-head{margin-bottom:22px;}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue-600);font-weight:700;margin-bottom:6px;}
.panel-head h2{font-family:'Source Serif 4',serif;font-size:26px;margin:0 0 6px;color:var(--navy-900);font-weight:600;}
.panel-head p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.55;max-width:640px;}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);
}
.card h3{
  font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy-700);
  margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px;
}
.card h3 small{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-soft);font-size:12px;}

.alert{border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.5;border:1px solid;}
.alert-red{background:var(--red-bg);border-color:var(--red-line);color:#7A1E17;}
.alert-red strong{color:var(--red);}
.alert-amber{background:var(--amber-bg);border-color:#F0DBAE;color:#6B4A0E;}
.alert-green{background:var(--green-bg);border-color:#BFE3CD;color:#134B31;}
.alert-icon{font-size:18px;line-height:1;flex:none;}

/* form controls */
.field-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--ice-100);}
.field-row:last-child{border-bottom:none;}
.field-label{font-size:14px;color:var(--ink);flex:1;}
.field-label .hint{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;}

.yn{display:flex;gap:6px;flex:none;}
.yn button{
  width:42px;height:34px;border-radius:7px;border:1px solid var(--line);background:#fff;
  font-family:inherit;font-weight:700;font-size:12.5px;color:var(--ink-soft);cursor:pointer;transition:all .12s;
}
.yn button.sel-yes{background:var(--red);border-color:var(--red);color:#fff;}
.yn button.sel-no{background:var(--green);border-color:var(--green);color:#fff;}
.yn.invert button.sel-yes{background:var(--green);border-color:var(--green);}
.yn.invert button.sel-no{background:var(--red);border-color:var(--red);}

.scale-row{padding:12px 0;border-bottom:1px solid var(--ice-100);}
.scale-row:last-child{border-bottom:none;}
.scale-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.scale-top .field-label{font-size:14px;}
.scale-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--blue-600);background:var(--ice-100);padding:2px 8px;border-radius:5px;}
.scale{display:flex;gap:5px;}
.scale button{
  flex:1;height:32px;border-radius:6px;border:1px solid var(--line);background:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .12s;
}
.scale button.sel{background:var(--blue-600);border-color:var(--blue-600);color:#fff;}
.scale button.sel.s0{background:#7FA6BE;}
.scale button.sel.s5, .scale button.sel.s6{background:var(--red);border-color:var(--red);}
.scale button.sel.s3, .scale button.sel.s4{background:var(--amber);border-color:var(--amber);}

select, input[type=text], input[type=number], input[type=time], input[type=date]{
  font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
  background:#fff;color:var(--ink);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
label.small-label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}

.checkline{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--ice-100);cursor:pointer;}
.checkline:last-child{border-bottom:none;}
.checkline input{margin-top:3px;width:16px;height:16px;accent-color:var(--red);flex:none;}
.checkline span{font-size:13.5px;line-height:1.45;}

.score-pill{
  display:inline-flex;align-items:baseline;gap:5px;font-family:'IBM Plex Mono',monospace;
  background:var(--ice-100);color:var(--navy-800);padding:4px 10px;border-radius:7px;font-size:13px;font-weight:600;
}
.score-pill b{font-size:15px;}

.word-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px;}
.word-cell{
  border:1px solid var(--line);border-radius:7px;padding:8px 6px;text-align:center;background:#fff;cursor:pointer;
  font-size:12.5px;color:var(--ink-soft);transition:all .12s;
}
.word-cell.sel{background:var(--green-bg);border-color:#8FCFAB;color:var(--green);font-weight:700;}

.nav-foot{display:flex;justify-content:space-between;margin-top:26px;}

/* summary */
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:8px;}
.score-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.score-box .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
.score-box .val{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;color:var(--navy-900);}
.score-box .val small{font-size:14px;font-weight:500;color:var(--ink-soft);}

@media (max-width:880px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:50;transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.open{transform:none;}
  .app{display:block;}
  .content{padding:20px 16px 80px;}
  .topbar{padding:14px 16px;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .word-grid{grid-template-columns:repeat(3,1fr);}
  .menu-btn{display:inline-flex !important;}
}
.menu-btn{display:none;}

@media print{
  .sidebar,.topbar-actions,.nav-foot,.menu-btn{display:none !important;}
  .app{display:block;}
  .panel{display:block !important;page-break-after:always;}
  .content{max-width:100%;padding:0;}
  body{background:#fff;}
}
</style>
</head>
<body>
<div class="app">

  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">SCAT<span>6</span></div>
      <div class="sub">CHU Caen · Médecine du Sport</div>
    </div>
    <ul class="steps" id="stepsList"></ul>
    <div class="sidebar-foot">Sport Concussion Assessment Tool 6 — usage réservé aux professionnels de santé formés.</div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div>
        <button class="btn menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <h1 id="topTitle">Renseignements sur l'athlète</h1>
        <div class="meta" id="topMeta">Étape 1 sur 10</div>
      </div>
      <div class="topbar-actions">
        <button class="btn" onclick="window.print()">Imprimer / PDF</button>
        <button class="btn" onclick="exportJSON()">Exporter</button>
        <button class="btn" onclick="resetAll()">Réinitialiser</button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ============================ DATA MODEL ============================ */
const state = {
  info:{id:'', date:'', heure:'', contexte:'baseline', evaluateur:'', tempsBlessure:''},
  visibles:{}, // key: index -> bool
  glasgow:{y:null,v:null,m:null},
  redflags:{}, // key -> bool
  cervicale:{douleur:null, sensibilite:null, force:null, amplitude:null},
  coordOcculo:{doigtNez:null, oculomoteur:null, mouvements:null, mouvementsDetail:''},
  maddocks:{q1:null,q2:null,q3:null,q4:null,q5:null},
  examenClinique:{paCoucheSys:'', paCoucheDia:'', fcCouche:'', paDeboutSys:'', paDeboutDia:'', fcDebout:'', orthostatiques:null, notes:''},
  histo:{hospitalisation:null, migraines:null, apprentissage:null, tdah:null, psy:null, medications:'', notes:''},
  symptomes:{}, // 22 items 0-6
  symptomesExtra:{aggravationPhysique:null, aggravationMentale:null, pourcentage:100, pourquoi:''},
  cognitif:{
    orientation:{mois:null,date:null,jour:null,annee:null,heure:null},
    memoireImmediate:{liste:'A', essai1:{}, essai2:{}, essai3:{}},
    concentration:{chiffres:{}, mois:{correct:false, erreurs:'', temps:''}}
  },
  equilibre:{piedTeste:'', surface:'', chaussure:'', deuxPieds:'', tandem:'', unPied:''},
  memoireDifferee:{},
  differenceObservee:null
};

const WORDS = {
  A:['Menton','Monnaie','Rideau','Lampe','Sucre','Feuille','Pêche','Oiseau','Viande','Bateau'],
  B:['Bébé','Poisson','Parfum','Jambe','Tapis','Pomme','Fumée','Écran','Chaise','Balle'],
  C:['Veste','Couteau','Chemin','Chapeau','Miroir','Beurre','Tissu','Film','Souris','Dessin']
};

const SYMPTOMS = [
  'Maux de tête','Impression de « pression dans la tête »','Douleur au cou','Nausée ou vomissements',
  'Étourdissements','Vision trouble','Problèmes d\'équilibre','Sensibilité à la lumière','Sensibilité au bruit',
  'Sensation d\'être au ralenti','Sensation d\'être « dans un brouillard »','Sensation de « ne pas être dans son assiette »',
  'Problème de concentration','Problème de mémoire','Fatigue ou manque d\'énergie','Confusion','Somnolence',
  'Émotivité accrue','Irritabilité','Tristesse','Nervosité ou anxiété','Difficulté à s\'endormir (si applicable)'
];

const VISIBLES = [
  "Couché·e et immobile sur le terrain","Chute sans protection sur le terrain",
  "Désorientation ou confusion, regard fixe ou réactivité limitée, ou incapacité à répondre adéquatement aux questions",
  "Regard vide ou sans expression","Blessure au visage à la suite de l'impact à la tête","Convulsions à la suite de l'impact",
  "Mécanisme de blessure à risques élevés (selon le sport pratiqué)",
  "Troubles de l'équilibre et de la démarche, manque de coordination motrice, ataxie (trébuchements, mouvements lents ou laborieux)"
];

const REDFLAGS = [
  "Douleur ou sensibilité au cou","Crise d'épilepsie ou convulsions","Vision double","Perte de connaissance",
  "Faiblesse, picotement ou sensation de brûlure dans plus d'un bras ou d'une jambe",
  "Détérioration de l'état de conscience","Vomissements","Maux de tête sévères ou s'intensifiant",
  "Agitation, agressivité ou combativité grandissante","Échelle de Glasgow < 15","Déformation visible du crâne"
];

const MADDOCKS = [
  "À quelle période du jeu sommes-nous ?",
  "Contre quelle équipe avez-vous joué la semaine dernière / le dernier match ?",
  "Dans quel stade sommes-nous aujourd'hui ?",
  "Votre équipe a-t-elle gagné le dernier match ?",
  "Qui a marqué le dernier but de ce match ?"
];

/* Digit sequences reconstructed from the source table (best-effort grouping —
   à vérifier contre le PDF SCAT6 officiel si besoin de certitude absolue sur
   la correspondance liste/essai). Two trials per length, per list. */
const DIGITS = {
  A:{3:['4-9-3','4-1-5'], 4:['3-8-1-4','4-9-6-8'], 5:['6-2-9-7-1','6-1-8-4-3'], 6:['7-1-8-4-6-2','7-2-4-8-5-6']},
  B:{3:['6-2-9','6-5-8'], 4:['3-2-7-9','6-8-3-1'], 5:['1-5-2-8-6','6-8-2-5-1'], 6:['5-3-9-1-4-8','3-7-6-5-1-9']},
  C:{3:['1-4-2','5-2-6'], 4:['1-7-9-5','3-4-8-1'], 5:['4-8-5-2-7','4-9-1-5-3'], 6:['8-3-1-9-6-4','9-2-6-5-1-4']}
};

const STEPS = [
  {id:'info', label:"Renseignements", title:"Renseignements sur l'athlète", desc:"Identification de l'évaluation et du contexte (valeurs de base ou évaluation post-blessure)."},
  {id:'visibles', label:"1 · Signes visibles", title:"Étape 1 — Signes visibles", desc:"Signes observés en personne ou sur vidéo, immédiatement après l'impact."},
  {id:'glasgow', label:"2 · Glasgow", title:"Étape 2 — Échelle de Glasgow", desc:"Score de Glasgow (Y+V+M) et signaux d'alarme (Encadré 1)."},
  {id:'cervicale', label:"3 · Colonne cervicale", title:"Étape 3 — Évaluation de la colonne cervicale", desc:"Si le patient n'est pas lucide, une blessure cervicale doit être suspectée et la colonne protégée."},
  {id:'coord', label:"4 · Coordination / Oculomoteur", title:"Étape 4 — Coordination et examen oculomoteur", desc:"Test doigt-nez et mouvements extraoculaires."},
  {id:'maddocks', label:"5 · Maddocks", title:"Étape 5 — Questionnaire de Maddocks", desc:"Questionnaire Maddocks modifié et évaluation de la mémoire (à adapter selon le sport)."},
  {id:'clinique', label:"Examen clinique", title:"Examen clinique", desc:"Tension artérielle couché / debout et remarques cliniques générales."},
  {id:'histo', label:"Antécédents", title:"Antécédents médicaux", desc:"Antécédents pertinents à l'évaluation hors surface de jeu."},
  {id:'symptomes', label:"Symptômes", title:"Étape 2 (SCAT6) — Évaluation des symptômes", desc:"22 symptômes cotés de 0 (aucun) à 6 (sévère). À faire remplir par l'athlète, au repos, sans distraction."},
  {id:'cognitif', label:"Examen cognitif", title:"Étape 3 — Examen cognitif (SAC)", desc:"Orientation, mémoire immédiate et concentration."},
  {id:'equilibre', label:"Coordination / Équilibre", title:"Étape 4 — Examen de coordination et d'équilibre", desc:"Version modifiée du Balance Error Scoring System (mBESS)."},
  {id:'differee', label:"Mémoire (rappel)", title:"Étape 5 — Mémoire différée", desc:"À réaliser au moins 5 minutes après la mémoire immédiate."},
  {id:'resume', label:"Résumé & scores", title:"Résumé de l'évaluation", desc:"Synthèse des scores et signaux d'alarme identifiés."}
];

let current = 0;

/* ============================ RENDER SIDEBAR ============================ */
function renderSidebar(){
  const ul = document.getElementById('stepsList');
  ul.innerHTML = STEPS.map((s,i)=>{
    const flagged = (s.id==='visibles' && anyChecked(state.visibles)) ||
                    (s.id==='glasgow' && anyChecked(state.redflags));
    return `<li><button class="step-btn ${i===current?'active':''} ${flagged?'flagged':''}" onclick="goTo(${i})">
      <span class="step-num">${flagged?'!':(i+1)}</span> ${s.label}
    </button></li>`;
  }).join('');
}
function anyChecked(obj){return Object.values(obj).some(v=>v===true);}

function goTo(i){
  current = i;
  document.getElementById('sidebar').classList.remove('open');
  render();
  window.scrollTo(0,0);
}

/* ============================ RENDER ============================ */
function render(){
  // preserve focus/cursor position across re-renders (text inputs re-render on every keystroke)
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  const selStart = (active && active.selectionStart!=null) ? active.selectionStart : null;
  const selEnd = (active && active.selectionEnd!=null) ? active.selectionEnd : null;

  renderSidebar();
  document.getElementById('topTitle').textContent = STEPS[current].title;
  document.getElementById('topMeta').textContent = `Étape ${current+1} sur ${STEPS.length}`;
  const c = document.getElementById('content');
  c.innerHTML = `<div class="panel active">
    <div class="panel-head"><div class="eyebrow">SCAT6</div><h2>${STEPS[current].title}</h2><p>${STEPS[current].desc}</p></div>
    ${renderPanel(STEPS[current].id)}
    <div class="nav-foot">
      <button class="btn" ${current===0?'disabled style="visibility:hidden"':''} onclick="goTo(${current-1})">← Précédent</button>
      <button class="btn btn-primary" ${current===STEPS.length-1?'style="visibility:hidden"':''} onclick="goTo(${current+1})">Suivant →</button>
    </div>
  </div>`;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ============================ PANEL BUILDERS ============================ */
function renderPanel(id){
  switch(id){
    case 'info': return panelInfo();
    case 'visibles': return panelVisibles();
    case 'glasgow': return panelGlasgow();
    case 'cervicale': return panelCervicale();
    case 'coord': return panelCoord();
    case 'maddocks': return panelMaddocks();
    case 'clinique': return panelClinique();
    case 'histo': return panelHisto();
    case 'symptomes': return panelSymptomes();
    case 'cognitif': return panelCognitif();
    case 'equilibre': return panelEquilibre();
    case 'differee': return panelDifferee();
    case 'resume': return panelResume();
  }
}

function panelInfo(){
  const i = state.info;
  return `<div class="card"><h3>Identification</h3>
    <div class="grid2" style="margin-bottom:14px">
      <div><label class="small-label">ID athlète</label><input id="f-id" type="text" style="width:100%" value="${i.id}" oninput="setInfo('id',this.value)"></div>
      <div><label class="small-label">Évaluateur</label><input id="f-evaluateur" type="text" style="width:100%" value="${i.evaluateur}" oninput="setInfo('evaluateur',this.value)"></div>
      <div><label class="small-label">Date de l'évaluation</label><input id="f-date" type="date" style="width:100%" value="${i.date}" oninput="setInfo('date',this.value)"></div>
      <div><label class="small-label">Heure de l'évaluation</label><input id="f-heure" type="time" style="width:100%" value="${i.heure}" oninput="setInfo('heure',this.value)"></div>

function setInfo(k,v){state.info[k]=v; render();}
function toggleVisible(idx){state.visibles[idx]=!state.visibles[idx]; render();}
function toggleRedflag(idx){state.redflags[idx]=!state.redflags[idx]; render();}
function setGlasgow(part,val){state.glasgow[part]=val; render();}
function setCervicale(k,val){state.cervicale[k]=val; render();}
function setCoord(k,val){state.coordOcculo[k]=val; render();}
function setMaddocks(k,val){state.maddocks[k]=val; render();}
function setClinique(k,val){state.examenClinique[k]=val; render();}
function setSymptom(idx,val){state.symptomes[idx]=val; render();}
function setSymptomExtra(k,val){state.symptomesExtra[k]=val; render();}
function setHisto(k,val){state.histo[k]=val; render();}
function setOrientation(k,val){state.cognitif.orientation[k]=val; render();}
function toggleWord(essai,list,word){
  const e = state.cognitif.memoireImmediate[essai];
  e[word] = !e[word];
  render();
}
function toggleDelayedWord(word){state.memoireDifferee[word]=!state.memoireDifferee[word]; render();}
function setDigit(idx,val){state.cognitif.concentration.chiffres[idx]=val; render();}
function setMonthsBackward(field,val){state.cognitif.concentration.mois[field]=val; render();}
function setEquilibre(k,val){state.equilibre[k]=val; render();}

        ${[{v:4,l:'Spontanée'},{v:3,l:'À la voix'},{v:2,l:'À la douleur'},{v:1,l:'Absente'}].map(o=>`<div class="field-row"><div class="field-label" style="font-size:12.5px">${o.v} — ${o.l}</div><input type="radio" name="gy" ${g.y===o.v?'checked':''} onchange="setGlasgow('y',${o.v})"></div>`).join('')}

      </div>
      <div><label class="small-label">Réponse motrice (M)</label>
        ${[{v:6,l:'Obéit aux ordres'},{v:5,l:'Localisée à la douleur'},{v:4,l:'Flexion / retrait'},{v:3,l:'Flexion anormale'},{v:2,l:'Extension'},{v:1,l:'Absente'}].map(o=>`<div class="field-row"><div class="field-label" style="font-size:12.5px">${o.v} — ${o.l}</div><input type="radio" name="gm" ${g.m===o.v?'checked':''} onchange="setGlasgow('m',${o.v})"></div>`).join('')}

  const hypoOrtho = (dSys!==null && dSys>=20) || (dDia!==null && dDia>=10);
  return `<div class="card"><h3>Tension artérielle et fréquence cardiaque</h3>
    <div class="grid2">
      <div>
        <label class="small-label">Couché — après ≥ 5 min de repos</label>
        <div class="grid3" style="margin-top:6px">
          <div><label class="small-label" style="font-weight:500;text-transform:none">PA systolique</label><input id="f-paCoucheSys" type="number" style="width:100%" value="${e.paCoucheSys}" oninput="setClinique('paCoucheSys',this.value)"></div>
          <div><label class="small-label" style="font-weight:500;text-transform:none">PA diastolique</label><input id="f-paCoucheDia" type="number" style="width:100%" value="${e.paCoucheDia}" oninput="setClinique('paCoucheDia',this.value)"></div>
          <div><label class="small-label" style="font-weight:500;text-transform:none">FC (bpm)</label><input id="f-fcCouche" type="number" style="width:100%" value="${e.fcCouche}" oninput="setClinique('fcCouche',this.value)"></div>
        </div>
      </div>
      <div>
        <label class="small-label">Debout — à 1 et/ou 3 min</label>
        <div class="grid3" style="margin-top:6px">
          <div><label class="small-label" style="font-weight:500;text-transform:none">PA systolique</label><input id="f-paDeboutSys" type="number" style="width:100%" value="${e.paDeboutSys}" oninput="setClinique('paDeboutSys',this.value)"></div>
          <div><label class="small-label" style="font-weight:500;text-transform:none">PA diastolique</label><input id="f-paDeboutDia" type="number" style="width:100%" value="${e.paDeboutDia}" oninput="setClinique('paDeboutDia',this.value)"></div>
          <div><label class="small-label" style="font-weight:500;text-transform:none">FC (bpm)</label><input id="f-fcDebout" type="number" style="width:100%" value="${e.fcDebout}" oninput="setClinique('fcDebout',this.value)"></div>
        </div>
      </div>
    </div>
    ${(dSys!==null||dDia!==null)?`<div style="margin-top:14px"><span class="score-pill">Δ systolique ${dSys!==null?dSys:'–'} mmHg</span> &nbsp; <span class="score-pill">Δ diastolique ${dDia!==null?dDia:'–'} mmHg</span></div>`:''}
    ${hypoOrtho?`<div class="alert alert-amber" style="margin-top:14px"><div class="alert-icon">ℹ</div><div>Chute tensionnelle ≥ 20 mmHg (systolique) et/ou ≥ 10 mmHg (diastolique) au passage debout — compatible avec une hypotension orthostatique.</div></div>`:''}
  </div>
  <div class="card"><h3>Symptômes et examen complémentaires</h3>
    <div class="field-row"><div class="field-label">Symptômes orthostatiques au passage debout (vertiges, voile noir...)</div>
      <div class="yn"><button type="button" class="${e.orthostatiques===true?'sel-yes':''}" onclick="setClinique('orthostatiques',true)">O</button>
      <button type="button" class="${e.orthostatiques===false?'sel-no':''}" onclick="setClinique('orthostatiques',false)">N</button></div>
    </div>
    <div style="margin-top:12px"><label class="small-label">Notes d'examen clinique (auscultation, examen neurologique complémentaire, plaies, etc.)</label>

function panelCognitif(){
  const o = state.cognitif.orientation;
  const orientScore = Object.values(o).filter(v=>v===1).length;
  const orow=(label,key)=>{
    const v=o[key];
    return `<div class="field-row"><div class="field-label">${label}</div><div class="yn">
      <button type="button" class="${v===1?'sel-yes':''}" onclick="setOrientation('${key}',1)">✓</button>
      <button type="button" class="${v===0?'sel-no':''}" onclick="setOrientation('${key}',0)">✗</button></div></div>`;
  };

  const mi = state.cognitif.memoireImmediate;
  const list = mi.liste;
  const words = WORDS[list];
  const trialScore = (essai)=>words.filter(w=>mi[essai][w]).length;
  const totalImmediate = trialScore('essai1')+trialScore('essai2')+trialScore('essai3');
  const wordGrid = (essai)=>`<div class="word-grid">${words.map(w=>`<div class="word-cell ${mi[essai][w]?'sel':''}" onclick="toggleWord('${essai}','${list}','${w}')">${w}</div>`).join('')}</div>`;

  const conc = state.cognitif.concentration;
  const digitScore = Object.values(conc.chiffres).filter(v=>v===1).length;
  const moisOk = conc.mois.correct;
  const concentrationTotal = Math.min(digitScore,4) + (moisOk?1:0);

  const cogTotal = orientScore + totalImmediate + concentrationTotal;

  return `
  <div class="card"><h3>Orientation <small>${orientScore} / 5</small></h3>
    ${orow('Quel mois sommes-nous ?','mois')}
    ${orow("Quelle est la date d'aujourd'hui ?",'date')}
    ${orow('Quel jour de la semaine sommes-nous ?','jour')}
    ${orow('En quelle année sommes-nous ?','annee')}
    ${orow("Quelle heure est-il actuellement ? (à l'heure près)",'heure')}
  </div>

  <div class="card"><h3>Mémoire immédiate <small>${totalImmediate} / 30 — liste ${list}</small></h3>
    <div style="margin-bottom:12px">
      <label class="small-label">Liste de mots utilisée</label>
      <div class="yn" style="justify-content:flex-start">
        ${['A','B','C'].map(l=>`<button type="button" style="width:auto;padding:0 14px" class="${list===l?'sel-yes':''}" onclick="state.cognitif.memoireImmediate.liste='${l}'; render()">${l}</button>`).join('')}
      </div>
    </div>
    <label class="small-label">Essai 1 — ${trialScore('essai1')} / 10</label>${wordGrid('essai1')}
    <label class="small-label" style="margin-top:14px;display:block">Essai 2 — ${trialScore('essai2')} / 10</label>${wordGrid('essai2')}
    <label class="small-label" style="margin-top:14px;display:block">Essai 3 — ${trialScore('essai3')} / 10</label>${wordGrid('essai3')}
  </div>

  <div class="card"><h3>Concentration <small>${concentrationTotal} / 5 — liste ${list}</small></h3>
    <label class="small-label">Chiffres à l'envers — cocher chaque série réussie (max 4 pts). Lire du haut vers le bas ; si la première série d'une longueur échoue, tenter la seconde ; en cas de nouvel échec, arrêter.</label>
    <div class="grid2" style="margin-top:8px">
      ${[3,4,5,6].map(n=>{
        const pair = DIGITS[list][n];
        const idx1 = n*10, idx2 = n*10+1;
        return `<label class="checkline"><input type="checkbox" ${conc.chiffres[idx1]?'checked':''} onchange="setDigit(${idx1}, this.checked?1:0)"><span>${n} chiffres — ${pair[0]}</span></label>
        <label class="checkline"><input type="checkbox" ${conc.chiffres[idx2]?'checked':''} onchange="setDigit(${idx2}, this.checked?1:0)"><span>${n} chiffres — ${pair[1]}</span></label>`;
      }).join('')}
    </div>
    <div style="margin-top:16px">
      <label class="small-label">Mois en sens inverse (1 pt si aucune erreur et &lt; 30 s)</label>
      <div class="field-row"><div class="field-label">Réussi sans erreur en moins de 30 secondes</div>
        <div class="yn"><button type="button" class="${conc.mois.correct===true?'sel-yes':''}" onclick="setMonthsBackward('correct',true)">O</button>
        <button type="button" class="${conc.mois.correct===false?'sel-no':''}" onclick="setMonthsBackward('correct',false)">N</button></div>
      </div>
      <div class="grid2" style="margin-top:8px">
        <div><label class="small-label">Temps (secondes)</label><input id="f-mois-temps" type="text" style="width:100%" value="${conc.mois.temps}" oninput="setMonthsBackward('temps',this.value)"></div>
        <div><label class="small-label">Nombre total d'erreurs</label><input id="f-mois-erreurs" type="text" style="width:100%" value="${conc.mois.erreurs}" oninput="setMonthsBackward('erreurs',this.value)"></div>
      </div>
    </div>
  </div>

  <div class="alert alert-green"><div class="alert-icon">Σ</div><div><strong>Sous-total examen cognitif (hors mémoire différée) : ${cogTotal} / 40</strong> (orientation ${orientScore}/5 + mémoire immédiate ${totalImmediate}/30 + concentration ${concentrationTotal}/5). La mémoire différée se complète à l'étape suivante, au moins 5 minutes plus tard.</div></div>
  `;
}

function panelDifferee(){
  const list = state.cognitif.memoireImmediate.liste;
  const words = WORDS[list];
  const md = state.memoireDifferee;
  const delayedScore = words.filter(w=>md[w]).length;
  return `<div class="card"><h3>Mémoire différée <small>${delayedScore} / 10 — liste ${list}, à réaliser ≥ 5 min après la mémoire immédiate</small></h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:0">« Vous souvenez-vous de la liste de mots lue plus tôt ? Répétez autant de mots que possible, dans n'importe quel ordre. »</p>
    <div class="word-grid">${words.map(w=>`<div class="word-cell ${md[w]?'sel':''}" onclick="toggleDelayedWord('${w}')">${w}</div>`).join('')}</div>
  </div>`;
}

function panelEquilibre(){
  const e = state.equilibre;
  const posRow = (label,key)=>`<div><label class="small-label">${label} — erreurs / 10</label><input id="f-equil-${key}" type="number" min="0" max="10" style="width:100%" value="${e[key]}" oninput="setEquilibre('${key}',this.value)"></div>`;
  const total = ['deuxPieds','tandem','unPied'].reduce((s,k)=>s+(parseInt(e[k])||0),0);
  return `<div class="card"><h3>mBESS <small>pied non dominant testé, 20 s par position — total ${total} / 30</small></h3>
    <div class="grid3" style="margin-bottom:14px">
      <div><label class="small-label">Pied testé</label><input id="f-piedTeste" type="text" style="width:100%" value="${e.piedTeste}" oninput="setEquilibre('piedTeste',this.value)"></div>
      <div><label class="small-label">Surface</label><input id="f-surface" type="text" style="width:100%" value="${e.surface}" oninput="setEquilibre('surface',this.value)"></div>
      <div><label class="small-label">Chaussure</label><input id="f-chaussure" type="text" style="width:100%" value="${e.chaussure}" oninput="setEquilibre('chaussure',this.value)"></div>
    </div>
    <div class="grid3">
      ${posRow('Position sur deux pieds','deuxPieds')}
      ${posRow('Position en tandem','tandem')}
      ${posRow('Position sur un pied','unPied')}
    </div>
  </div>
  <div class="alert alert-amber"><div class="alert-icon">ℹ</div><div>Si le mBESS révèle des résultats normaux, la marche en tandem simple (et double tâche en option) peut être réalisée. Si des anormalités cliniquement significatives sont observées, différer la marche en tandem au SCOAT6.</div></div>`;
}

function panelResume(){
  const flaggedVisible = anyChecked(state.visibles);
  const flaggedRed = anyChecked(state.redflags);
  const g = state.glasgow, gTotal = (g.y||0)+(g.v||0)+(g.m||0);
  const nonZeroSymp = SYMPTOMS.filter((_,i)=>(state.symptomes[i]||0)>0).length;
  const severity = SYMPTOMS.reduce((s,_,i)=>s+(state.symptomes[i]||0),0);
  const maddocksScore = ['q1','q2','q3','q4','q5'].filter(k=>state.maddocks[k]===1).length;

  const o = state.cognitif.orientation;
  const orientScore = Object.values(o).filter(v=>v===1).length;
  const mi = state.cognitif.memoireImmediate;
  const words = WORDS[mi.liste];
  const trialScore = (essai)=>words.filter(w=>mi[essai][w]).length;
  const totalImmediate = trialScore('essai1')+trialScore('essai2')+trialScore('essai3');
  const conc = state.cognitif.concentration;
  const digitScore = Math.min(Object.values(conc.chiffres).filter(v=>v===1).length,4);
  const concentrationTotal = digitScore + (conc.mois.correct?1:0);
  const delayedScore = words.filter(w=>state.memoireDifferee[w]).length;
  const cogTotal = orientScore+totalImmediate+concentrationTotal+delayedScore;

  const equilTotal = ['deuxPieds','tandem','unPied'].reduce((s,k)=>s+(parseInt(state.equilibre[k])||0),0);

  return `
  ${(flaggedVisible||flaggedRed)?`<div class="alert alert-red"><div class="alert-icon">⚠</div><div><strong>Retrait immédiat recommandé.</strong> Des signes visibles et/ou signaux d'alarme ont été cochés lors de cette évaluation. Se référer aux étapes 1 et 2 pour le détail.</div></div>`
  :`<div class="alert alert-green"><div class="alert-icon">✓</div><div>Aucun signe visible ni signal d'alarme n'a été coché lors de cette évaluation.</div></div>`}

  <div class="score-grid">
    <div class="score-box"><div class="label">Glasgow</div><div class="val">${gTotal>0?gTotal:'–'}<small> / 15</small></div></div>
    <div class="score-box"><div class="label">Maddocks</div><div class="val">${maddocksScore}<small> / 5</small></div></div>
    <div class="score-box"><div class="label">Symptômes rapportés</div><div class="val">${nonZeroSymp}<small> / 22</small></div></div>
    <div class="score-box"><div class="label">Sévérité des symptômes</div><div class="val">${severity}<small> / 132</small></div></div>
    <div class="score-box"><div class="label">Examen cognitif (SAC)</div><div class="val">${cogTotal}<small> / 50</small></div></div>
    <div class="score-box"><div class="label">mBESS (erreurs)</div><div class="val">${equilTotal}<small> / 30</small></div></div>
  </div>

  <div class="card"><h3>Détail — Examen cognitif</h3>
    <div class="field-row"><div class="field-label">Orientation</div><span class="score-pill">${orientScore}<b>/5</b></span></div>
    <div class="field-row"><div class="field-label">Mémoire immédiate</div><span class="score-pill">${totalImmediate}<b>/30</b></span></div>
    <div class="field-row"><div class="field-label">Concentration</div><span class="score-pill">${concentrationTotal}<b>/5</b></span></div>
    <div class="field-row"><div class="field-label">Mémoire différée</div><span class="score-pill">${delayedScore}<b>/10</b></span></div>
  </div>

  <div class="card"><h3>Examen clinique</h3>
    <div class="field-row"><div class="field-label">Tension artérielle couché / debout</div>
      <span class="score-pill">${state.examenClinique.paCoucheSys||'–'}/${state.examenClinique.paCoucheDia||'–'} → ${state.examenClinique.paDeboutSys||'–'}/${state.examenClinique.paDeboutDia||'–'} mmHg</span></div>
    <div class="field-row"><div class="field-label">Fréquence cardiaque couché / debout</div>
      <span class="score-pill">${state.examenClinique.fcCouche||'–'} → ${state.examenClinique.fcDebout||'–'} bpm</span></div>
  </div>

  <div class="card"><h3>Impression clinique</h3>
    <div class="field-row"><div class="field-label">Si l'évaluateur connaissait l'athlète avant sa blessure, celui-ci semble-t-il différent ?</div>
      <div class="yn"><button type="button" class="${state.differenceObservee===true?'sel-yes':''}" onclick="state.differenceObservee=true; render()">O</button>
      <button type="button" class="${state.differenceObservee===false?'sel-no':''}" onclick="state.differenceObservee=false; render()">N</button></div>
    </div>
  </div>

  <div class="card" style="background:var(--ice-100)"><h3>Identification</h3>
    <div style="font-size:13.5px;color:var(--ink-soft);line-height:1.8">
      ID athlète : <strong>${state.info.id||'—'}</strong> · Évaluateur : <strong>${state.info.evaluateur||'—'}</strong><br>
      Date : <strong>${state.info.date||'—'}</strong> à <strong>${state.info.heure||'—'}</strong> · Contexte : <strong>${state.info.contexte==='baseline'?'Valeurs de base':'Post-blessure'}</strong>
    </div>
  </div>
  `;
}

/* ============================ EXPORT / RESET ============================ */
function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const name = (state.info.id||'athlete').replace(/\s+/g,'_');
  a.href = url; a.download = `SCAT6_${name}_${state.info.date||'sans_date'}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function resetAll(){
  if(!confirm('Réinitialiser toutes les données saisies dans ce formulaire ?')) return;
  location.reload();
}

/* ============================ INIT ============================ */
render();
</script>
</body>
</html>
